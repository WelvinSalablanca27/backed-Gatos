<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Gato</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        #resultado {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card p-4">

                    <h2 class="text-center mb-4">
                        Registro de Gato
                    </h2>

                    <form id="formGato">

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                required
                                placeholder="Ej: Michi"
                            >
                        </div>

                        <!-- Edad -->
                        <div class="mb-3">
                            <label for="edad" class="form-label">
                                Edad (años)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="edad"
                                required
                                min="0"
                                step="0.1"
                                placeholder="Ej: 2.5"
                            >
                        </div>

                        <!-- Peso -->
                        <div class="mb-3">
                            <label for="peso" class="form-label">
                                Peso (kg)
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="peso"
                                required
                                min="0"
                                step="0.1"
                                placeholder="Ej: 4.2"
                            >
                        </div>

                        <!-- Raza -->
                        <div class="mb-3">
                            <label for="raza" class="form-label">
                                Raza
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="raza"
                                required
                                placeholder="Ej: Siames"
                            >
                        </div>

                        <!-- Botón -->
                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Registrar Gato
                        </button>

                    </form>

                    <!-- Resultado del backend -->
                    <div
                        id="resultado"
                        class="alert alert-success mt-4"
                        role="alert"
                    ></div>

                </div>

            </div>

        </div>

    </div>

    <script>

        // URL de tu backend en Render
        const BACKEND_URL =
            "https://backend-gato.onrender.com/gato";

        // Capturamos el formulario
        document
            .getElementById("formGato")
            .addEventListener("submit", async (e) => {

                // Evita que la página se recargue
                e.preventDefault();

                // Obtener datos del formulario
                const datos = {
                    nombre: document
                        .getElementById("nombre")
                        .value
                        .trim(),

                    edad: Number(
                        document
                            .getElementById("edad")
                            .value
                    ),

                    peso: Number(
                        document
                            .getElementById("peso")
                            .value
                    ),

                    raza: document
                        .getElementById("raza")
                        .value
                        .trim()
                };

                // Div donde mostraremos el resultado
                const resultadoDiv =
                    document.getElementById("resultado");

                resultadoDiv.style.display = "none";

                try {

                    // Enviar datos al backend
                    const respuesta = await fetch(
                        BACKEND_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(datos)
                        }
                    );

                    // Convertir respuesta a JSON
                    const data = await respuesta.json();

                    // Si el backend respondió correctamente
                    if (respuesta.ok) {

                        resultadoDiv.className =
                            "alert alert-success mt-4";

                        resultadoDiv.textContent =
                            data.mensaje ||
                            "Gato registrado correctamente.";

                    } else {

                        resultadoDiv.className =
                            "alert alert-danger mt-4";

                        resultadoDiv.textContent =
                            data.mensaje ||
                            "Error al registrar el gato.";
                    }

                    // Mostrar mensaje
                    resultadoDiv.style.display = "block";

                } catch (error) {

                    console.error(error);

                    resultadoDiv.className =
                        "alert alert-danger mt-4";

                    resultadoDiv.textContent =
                        "Error de conexión con el servidor.";

                    resultadoDiv.style.display = "block";
                }

            });

    </script>

</body>

</html>
